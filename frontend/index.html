<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voltix · Smart tech, made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="shell">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar card">
      <div class="brand">
        <svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true">
          <path d="M8 8 L36 66" stroke="#7c5cf6" stroke-width="9" stroke-linecap="round" fill="none"/>
          <path d="M72 8 L40 66" stroke="#7c5cf6" stroke-width="9" stroke-linecap="round" fill="none"/>
          <path d="M52 34 L40 62" stroke="#c8f031" stroke-width="9" stroke-linecap="round" fill="none"/>
        </svg>
        <h1>VOLTIX</h1>
        <p>Smart tech, made simple</p>
      </div>
      <nav>
        <h4>Your store</h4>
        <a href="#/" data-route="/">🏠 Home</a>
        <h4>Account</h4>
        <a href="#/wishlist" data-route="/wishlist">💜 Wishlist</a>
        <a href="#/cart" data-route="/cart">🛍 Cart</a>
        <a href="#/orders" data-route="/orders">📦 Orders</a>
        <a href="#/profile" data-route="/profile">🏅 Profile</a>
        <a href="#/login" data-route="/login" id="authLink">👤 Login / Sign up</a>
      </nav>
    </aside>

    <!-- RIGHT SIDE -->
    <div class="main">
      <header class="topbar card">
        <form id="searchForm" class="search">
          <input id="searchInput" type="search" placeholder="Search products, brands and more…" />
        </form>
        <a href="#/products?sort=new">New arrivals</a>
        <a href="#/products?sort=rating">Best sellers</a>
        <a href="#/products">Deals</a>
        <button id="themeBtn" class="icon-btn" title="Dark mode">🌙</button>
        <a href="#/cart" class="cart-btn">🛍 Cart <span id="cartCount" class="badge">0</span></a>
      </header>

      <!-- IMPORTANT: ella pages um inga than render aagum -->
      <main id="app"></main>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- IMPORTANT: script order maathakoodathu. config -> api -> state -> ui -> theme -> router -> pages -> main -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/wishlist.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
